name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # статике неоткуда обновляться самой, поэтому пересобираем сайт по расписанию:
  # каждый день в 04:00 UTC (07:00 МСК) свежие данные из таблицы уезжают на Pages
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # тянем свежие вкладки из таблицы, чтобы опубликованный сайт
      # соответствовал тому, что сейчас в медиаплане
      - name: Refresh data from Google Sheets
        run: npm run build:data -- --remote
        continue-on-error: true

      - name: Build static site
        run: npm run build:static
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
